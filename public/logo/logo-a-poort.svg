<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" width="420" height="96">
  <title>CoPortaal — concept A: de poort</title>
  <!-- Beeldmerk: een poort (portaal) gevormd door twee bogen; de gouden stip is de klant die binnenkomt. -->
  <g transform="translate(8,8)">
    <path d="M12 80 V40 a28 28 0 0 1 56 0 V80" fill="none" stroke="#1E2A5A" stroke-width="10" stroke-linecap="round"/>
    <path d="M30 80 V44 a10 10 0 0 1 20 0 V80" fill="none" stroke="#1E2A5A" stroke-width="10" stroke-linecap="round"/>
    <circle cx="40" cy="22" r="7" fill="#D6B249"/>
  </g>
  <text x="104" y="58" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#1E2A5A" letter-spacing="-1">Co<tspan fill="#2F55A4">Portaal</tspan></text>
  <text x="106" y="80" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#6B7280" letter-spacing="2.5">PRAKTIJKBEHEER VOOR KANTOREN</text>
</svg>
